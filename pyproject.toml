[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ivs-sessions-browser"
dynamic = ["version"]
description = "A terminal-based TUI for browsing IVS session schedules with fast filtering and keyboard navigation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "jole"}]
keywords = ["ivs", "vlbi", "sessions", "tui", "curses"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "twine>=5.0",
    "wheel>=0.43",
]

[project.scripts]
ivs-sessions-browser = "ivs_sessions_browser:main"

[project.urls]
Homepage = "https://github.com/jonleithe/ivs_sessions_browser"
Repository = "https://github.com/jonleithe/ivs_sessions_browser"
Documentation = "https://github.com/jonleithe/ivs_sessions_browser/tree/v4/docs"
Issues = "https://github.com/jonleithe/ivs_sessions_browser/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
ivs_sessions_browser = [
    "operators.json",
    "WHATS_NEW.md",
    "certs/*.pem",
    "certs/README.md",
    "man/*.1",
]

[tool.setuptools_scm]
write_to = "src/ivs_sessions_browser/version.py"
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"
version_scheme = "post-release"
local_scheme = "no-local-version"
