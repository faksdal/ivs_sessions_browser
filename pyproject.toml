[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivs_sessions_browser"
version = "4.0.0"
description = "A terminal-based TUI for browsing IVS session schedules with fast filtering and keyboard navigation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LICENSE"}
authors = [{name = "leijon"}]

dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ivs-sessions-browser = "ivs_sessions_browser.__main__:main"

[tool.setuptools]
packages = ["ivs_sessions_browser"]
package-dir = {"" = "src"}
